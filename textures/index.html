<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Matblox Texture Maker</title>
    <link rel="icon" type="image/png" href="dicon.png">
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; user-select: none; }
        #canvas-container { display: flex; justify-content: center; margin: 20px; }
        #grid { display: grid; gap: 1px; background: #333; padding: 2px; }
        .pixel { background: rgba(0,0,0,0); cursor: pointer; border: 1px solid #1a1a1a; }
        .controls { margin: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .slider-group { display: flex; align-items: center; gap: 10px; }
        input, button, select { padding: 10px; margin: 5px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; border: none; }
        input[type="range"] { width: 150px; cursor: pointer; }
        .quality-input { width: 50px; text-align: center; }
        .checkbox-group { display: flex; gap: 15px; background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #333; margin: 5px; }
        .checkbox-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { margin: 0; cursor: pointer; }
        #layerControl { background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #333; margin: 10px; display: none; }
    </style>
</head>
<body>

    <h1>Matblox Texture Maker (.matimg)</h1>
    
    <div class="controls">
        <div>
            <label>Color (RRGGBB): <input type="color" id="colorPicker" value="#00ffff"></label>
        </div>

        <div class="slider-group">
            <label>Alpha/Transparency (AA): </label>
            <input type="range" id="alphaSlider" min="0" max="255" value="255" oninput="updateLabel('alphaLabel', this.value)">
            <span id="alphaLabel">FF</span>
        </div>
        
        <div class="slider-group">
            <label>Luminance (LL): </label>
            <input type="range" id="lumSlider" min="0" max="255" value="0" oninput="updateLabel('lumLabel', this.value)">
            <span id="lumLabel">00</span>
        </div>

        <div class="slider-group">
            <label>Mirror (MM): </label>
            <input type="range" id="mirSlider" min="0" max="255" value="255" oninput="updateLabel('mirLabel', this.value)">
            <span id="mirLabel">FF</span>
        </div>
    </div>
    <div id="layerControl">
        <label>Current Layer (Z): <input type="range" id="layerSlider" min="0" max="15" value="0" oninput="changeLayer(this.value)"></label>
        <span id="layerLabel">0</span>
    </div>

    <div id="canvas-container">
        <div id="grid"></div>
    </div>

    <div class="controls">
        <div>
            <input type="text" id="filename" value="diamond" placeholder="File name"> .matimg
            <select id="encodingSelect">
                <option value="base64" selected>base64</option>
                <option value="base16">base16(defalut and heavy)</option>
                <option value="base2">base2(Do Not Use That Plsssss)</option>
                <option value="base64url">base64(url)</option>
            </select>
        </div>

        <div>
            <label>X Quality: <input type="number" id="xQuality" class="quality-input" value="16" onchange="updateGridDimensions()"></label>
            <label>Y Quality: <input type="number" id="yQuality" class="quality-input" value="16" onchange="updateGridDimensions()"></label>
            <label>Z Quality: <input type="number" id="zQuality" class="quality-input" value="16" onchange="updateGridDimensions()"></label>
        </div>

        <div>
            <span>Scale Positions:</span>
            <div class="checkbox-group">
                <label><input type="checkbox" id="posX" value="x" checked onchange="updateGridDimensions()"> X</label>
                <label><input type="checkbox" id="posY" value="y" checked onchange="updateGridDimensions()"> Y</label>
                <label><input type="checkbox" id="posZ" value="z" onchange="updateGridDimensions()"> Z</label>
            </div>
        </div>

        <div>
            <span>Texture Values:</span>
            <div class="checkbox-group">
                <label><input type="checkbox" id="valR" value="r" checked> r</label>
                <label><input type="checkbox" id="valG" value="g" checked> g</label>
                <label><input type="checkbox" id="valB" value="b" checked> b</label>
                <label><input type="checkbox" id="valA" value="a" checked> a</label>
                <label><input type="checkbox" id="valL" value="l" checked> l</label>
                <label><input type="checkbox" id="valM" value="m" checked> m</label>
            </div>
        </div>

        <button onclick="saveMatimg()">SAVE AS .MATIMG</button>
    </div>
    <script>
        const grid = document.getElementById('grid');
        let pixelData = {};
        let isDrawing = false;
        let currentLayer = 0;
        let currentCols = 16;
        let currentRows = 16;
        let currentLayersCount = 1;

        window.addEventListener('mousedown', () => { isDrawing = true; });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        function toHex(val) {
            let hex = parseInt(val).toString(16).toUpperCase();
            return hex.length < 2 ? "0" + hex : hex;
        }

        function updateLabel(id, val) {
            document.getElementById(id).innerText = toHex(val);
        }

        function hexToRgb(hex) {
            let cleanHex = hex.replace('#', '');
            return {
                r: parseInt(cleanHex.substring(0, 2), 16),
                g: parseInt(cleanHex.substring(2, 4), 16),
                b: parseInt(cleanHex.substring(4, 6), 16)
            };
        }

        function getPixelStyle(hexTag) {
            if (!hexTag || hexTag === "000000000000") return "rgba(0,0,0,0)";
            let rgb = hexToRgb("#" + hexTag.substring(0, 6));
            let alphaDecimal = parseInt(hexTag.substring(6, 8), 16) / 255;
            return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alphaDecimal})`;
        }

        function updateGridDimensions() {
            let hasX = document.getElementById('posX').checked;
            let hasY = document.getElementById('posY').checked;
            let hasZ = document.getElementById('posZ').checked;

            let xQ = parseInt(document.getElementById('xQuality').value) || 16;
            let yQ = parseInt(document.getElementById('yQuality').value) || 16;
            let zQ = parseInt(document.getElementById('zQuality').value) || 16;

            currentCols = hasX ? xQ : 1;
            currentRows = hasY ? yQ : 1;
            currentLayersCount = hasZ ? zQ : 1;

            if (hasZ && zQ > 1) {
                document.getElementById('layerControl').style.display = "block";
                document.getElementById('layerSlider').max = zQ - 1;
                if (currentLayer >= zQ) {
                    currentLayer = zQ - 1;
                    document.getElementById('layerSlider').value = currentLayer;
                }
                document.getElementById('layerLabel').innerText = currentLayer;
            } else {
                document.getElementById('layerControl').style.display = "none";
                currentLayer = 0;
            }

            buildGrid();
        }

        function buildGrid() {
            grid.innerHTML = "";
            grid.style.gridTemplateColumns = `repeat(${currentCols}, 25px)`;
            grid.style.gridTemplateRows = `repeat(${currentRows}, 25px)`;

            let totalPixels = currentCols * currentRows;
            for (let i = 0; i < totalPixels; i++) {
                const div = document.createElement('div');
                div.className = 'pixel';
                div.style.width = '25px';
                div.style.height = '25px';

                let dataKey = currentLayer + "_" + i;
                if (!pixelData[dataKey]) {
                    pixelData[dataKey] = "000000000000";
                }
                div.style.background = getPixelStyle(pixelData[dataKey]);

                div.addEventListener('mousedown', function() {
                    drawPixel(div, i);
                });

                div.addEventListener('mouseenter', function() {
                    if (isDrawing) {
                        drawPixel(div, i);
                    }
                });

                grid.appendChild(div);
            }
        }

        function changeLayer(val) {
            currentLayer = parseInt(val);
            document.getElementById('layerLabel').innerText = currentLayer;
            buildGrid();
        }

        function drawPixel(div, index) {
            const hexColor = document.getElementById('colorPicker').value;
            const aaValue = document.getElementById('alphaSlider').value;
            
            const aa = toHex(aaValue);
            const ll = toHex(document.getElementById('lumSlider').value);
            const mm = toHex(document.getElementById('mirSlider').value);

            const cleanColor = hexColor.replace('#', '').toUpperCase();
            const fullTag = cleanColor + aa + ll + mm;
            
            let dataKey = currentLayer + "_" + index;
            pixelData[dataKey] = fullTag;

            const rgb = hexToRgb(hexColor);
            const alphaDecimal = aaValue / 255;
            div.style.background = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alphaDecimal})`;
        }

        function saveMatimg() {
            const fileName = document.getElementById('filename').value.trim() || 'texture';
            const selectedEncoding = document.getElementById('encodingSelect').value;
            
            const xQ = document.getElementById('xQuality').value || '16';
            const yQ = document.getElementById('yQuality').value || '16';
            const zQ = document.getElementById('zQuality').value || '16';

            let selectedPos = [];
            if (document.getElementById('posX').checked) selectedPos.push("x");
            if (document.getElementById('posY').checked) selectedPos.push("y");
            if (document.getElementById('posZ').checked) selectedPos.push("z");

            let selectedValues = [];
            if (document.getElementById('valR').checked) selectedValues.push("r");
            if (document.getElementById('valG').checked) selectedValues.push("g");
            if (document.getElementById('valB').checked) selectedValues.push("b");
            if (document.getElementById('valA').checked) selectedValues.push("a");
            if (document.getElementById('valL').checked) selectedValues.push("l");
            if (document.getElementById('valM').checked) selectedValues.push("m");

            let exportArray = [];
            for (let z = 0; z < currentLayersCount; z++) {
                let layerSize = currentCols * currentRows;
                for (let i = 0; i < layerSize; i++) {
                    let key = z + "_" + i;
                    exportArray.push(pixelData[key] || "000000000000");
                }
            }

            let rawPixelsText = exportArray.join(",");
            let encodedPixels = "";

            if (selectedEncoding === "base64" || selectedEncoding === "base64url") {
                encodedPixels = btoa(rawPixelsText);
                if (selectedEncoding === "base64url") {
                    encodedPixels = encodedPixels.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                }
            } else if (selectedEncoding === "base16") {
                encodedPixels = rawPixelsText;
            } else if (selectedEncoding === "base2") {
                for (let i = 0; i < rawPixelsText.length; i++) {
                    let b = rawPixelsText.charCodeAt(i).toString(2);
                    encodedPixels += "0".repeat(8 - b.length) + b;
                }
            }

            let qualityString = xQ + "x" + yQ + "x" + zQ;
            let posString = "[" + selectedPos.join(",") + "]";
            let valuesString = "[" + selectedValues.join(",") + "]";

            let finalText = "MATBLOX_MATIMG:" + qualityString + ":" + posString + ":" + valuesString + ":" + selectedEncoding + ":" + encodedPixels;

            const blob = new Blob([finalText], { type: 'text/plain;charset=utf-8' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName + '.matimg';
            link.click();
            
            URL.revokeObjectURL(link.href);
        }

        updateGridDimensions();
    </script>

</body>
</html>
