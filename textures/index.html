<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Matblox Texture Maker</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; }
        #canvas-container { display: flex; justify-content: center; margin: 20px; }
        #grid { display: grid; grid-template-columns: repeat(16, 25px); grid-template-rows: repeat(16, 25px); gap: 1px; background: #333; padding: 2px; }
        .pixel { width: 25px; height: 25px; background: #000; cursor: pointer; border: 1px solid #1a1a1a; }
        .controls { margin: 20px; }
        input, button { padding: 10px; margin: 5px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <h1>Matblox Texture Maker (.matimg)</h1>
    
    <div class="controls">
        <label>Kolor (RRGGBB): <input type="color" id="colorPicker" value="#00ffff"></label>
        <label>Świecenie (LL 00-FF): <input type="text" id="lumPicker" value="00" maxlength="2" style="width: 40px; text-align:center;"></label>
        <label>Lustro (MM 00-FF): <input type="text" id="mirPicker" value="00" maxlength="2" style="width: 40px; text-align:center;"></label>
    </div>

    <div id="canvas-container">
        <div id="grid"></div>
    </div>

    <div class="controls">
        <input type="text" id="filename" value="diamond" placeholder="Nazwa pliku"> .matimg
        <br><br>
        <button onclick="pobierzMatimg()">ZAPISZ JAKO .MATIMG</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        let pikseleData = Array(256).fill("#0000000000");

        for (let i = 0; i < 256; i++) {
            const div = document.createElement('div');
            div.className = 'pixel';
            div.onclick = function() {
                const kolorHex = document.getElementById('colorPicker').value;
                let ll = document.getElementById('lumPicker').value.substring(0,2).toUpperCase();
                let mm = document.getElementById('mirPicker').value.substring(0,2).toUpperCase();
                
                if(ll.length < 2) ll = "00";
                if(mm.length < 2) mm = "00";

                const pelnyKod = kolorHex.toUpperCase() + ll + mm;
                
                div.style.background = kolorHex;
                pikseleData[i] = pelnyKod;
            };
            grid.appendChild(div);
        }

        function pobierzMatimg() {
            const nazwaPliku = document.getElementById('filename').value.trim() || 'texture';
            
            const strukturaPliku = {
                val: { scale: { x: 16, y: 16 }, values: ["r", "g", "b", "a", "l", "m"], encoding: "none" },
                art: pikseleData
            };

            const tekstDoZapisu = JSON.stringify(strukturaPliku);
            const plik = new Blob([tekstDoZapisu], { type: 'text/plain' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(plik);
            link.download = nazwaPliku + '.matimg';
            link.click();
            
            URL.revokeObjectURL(link.href);
        }
    </script>

</body>
</html>
